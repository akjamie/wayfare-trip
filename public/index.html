<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>wayfare-trip — weather-aware attraction recommendations</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; line-height: 1.5; }
      main { max-width: 760px; margin: 0 auto; padding: 2rem 1rem 4rem; }
      h1 { font-size: 1.5rem; margin: 0 0 0.25rem; }
      p.sub { margin: 0 0 1.5rem; opacity: 0.7; }
      form { display: flex; gap: 0.5rem; flex-wrap: wrap; }
      input, button { font: inherit; padding: 0.6rem 0.75rem; border-radius: 8px; border: 1px solid #8888; }
      input { flex: 1 1 220px; }
      button { cursor: pointer; }
      .day { border: 1px solid #8884; border-radius: 12px; padding: 1rem; margin-top: 1rem; }
      .day h2 { font-size: 1rem; margin: 0 0 0.25rem; }
      .advice { opacity: 0.85; margin: 0 0 0.75rem; }
      ul { margin: 0; padding-left: 1.1rem; }
      .env { font-size: 0.8rem; opacity: 0.7; }
      .notice { background: #ffb00022; border: 1px solid #ffb00066; border-radius: 8px; padding: 0.5rem 0.75rem; margin-top: 1rem; }
      .error { color: #c0392b; margin-top: 1rem; }
      .zag { color: #2c7a4b; }
    </style>
  </head>
  <body>
    <main>
      <h1>Weather-aware attraction recommendations</h1>
      <p class="sub">Enter a Chinese city (e.g. Beijing, 北京, beijing). Rainy days favour indoor spots; hot days avoid midday outdoors.</p>
      <form id="form">
        <input id="city" name="city" placeholder="City name" autocomplete="off" />
        <input id="days" name="days" type="number" min="1" max="16" value="7" style="max-width: 6rem" />
        <button type="submit">Recommend</button>
      </form>
      <div id="output"></div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
